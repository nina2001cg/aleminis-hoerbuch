<head>

<title>Die Alemänis und die verschwundene Stadionuhr</title>
<style>
:root { color-scheme: dark; --yellow:#f4d21f; --bg:#111; --panel:#1d1d1d; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(circle at top, #34300d 0, var(--bg) 55%); color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
main { width:min(100%,430px); text-align:center; background:var(--panel); padding:24px;
  border:1px solid rgba(244,210,31,.45); border-radius:22px; box-shadow:0 18px 55px #0009; }
img { width:min(76%,280px); aspect-ratio:1; object-fit:cover; border-radius:14px;
  border:3px solid var(--yellow); box-shadow:0 8px 28px #0008; }
.eyebrow { margin:22px 0 8px; color:var(--yellow); font-size:.78rem; font-weight:800;
  letter-spacing:.16em; text-transform:uppercase; }
h1 { margin:0 0 8px; font-size:clamp(1.45rem,6vw,2rem); line-height:1.15; }
p { color:#c9c9c9; margin:0 0 20px; }
.player { overflow:hidden; border-radius:12px; background:#fff; min-height:110px; }
iframe { display:block; width:100%; height:110px; border:0; }
.note { margin:16px 0 0; font-size:.78rem; color:#aaa; }
.accent { height:4px; width:64px; background:var(--yellow); border-radius:9px; margin:0 auto 20px; }
</style>
